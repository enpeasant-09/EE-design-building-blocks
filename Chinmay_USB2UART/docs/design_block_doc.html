<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Block Record</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ==========================================================================
   Design-block record — "precision instrument meets datasheet".
   Layout idea: a datasheet page (paper, rules, title block) with instrument
   panels for the calculators (graph-paper equation strip, fader inputs,
   readout column, terminal code reveal).
   ALL visual styling lives here (single style block). Tokens first; every
   component below uses tokens only.
   ========================================================================== */
:root {
  /* palette — light: cool paper, graphite ink, probe-cyan signal */
  --paper: #f2f3f0;
  --surface: #ffffff;
  --surface-2: #f6f7f5;
  --ink: #15191c;
  --ink-2: #3b434a;
  --muted: #5b646c;
  --line: #d6dad8;
  --line-strong: #aeb5b8;
  --accent: #006d87;
  --accent-ink: #ffffff;
  --accent-soft: #e0eff2;
  --focus: #0089a8;
  --ok: #17733a;   --ok-bg: #e2f1e6;
  --warn: #875200; --warn-bg: #fbeed3;
  --fail: #b1251c; --fail-bg: #fbe3e0;
  --grid-minor: rgba(0, 109, 135, .06);
  --grid-major: rgba(0, 109, 135, .12);
  --readout-bg: #f0f4f4;
  --hl: #fff6c9;
  /* terminal (code reveal) — dark in both themes */
  --term-bg: #0d1215;
  --term-bar: #161d22;
  --term-line: #26313a;
  --term-fg: #d5dde1;
  --term-muted: #82909a;
  --tok-kw: #7fd3e6;
  --tok-str: #a9d99a;
  --tok-num: #f4c06a;
  --tok-com: #74838d;
  --tok-fn: #c7adff;

  /* legacy aliases used by older rules / JS-generated markup */
  --bg: var(--paper); --fg: var(--ink); --card: var(--surface); --card-2: var(--surface-2);
  --border: var(--line); --info-bg: var(--accent-soft); --code-bg: var(--term-bg);

  /* type */
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", "DejaVu Sans Condensed", var(--sans);
  --mono: "IBM Plex Mono", "JetBrains Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
  --fs-0: 12px;
  --fs-1: 13.5px;
  --fs-2: 15px;
  --fs-3: 17px;
  --fs-4: 21px;
  --fs-5: 30px;
  --fs-out: 24px;

  /* shape & space */
  --r-1: 3px;
  --r-2: 6px;
  --r-3: 9px;
  --radius: var(--r-3);
  --radius-sm: var(--r-2);
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 18px;
  --sp-5: 28px;
  --sp-6: 44px;
  --toc-w: 236px;
  --toolbar-h: 56px;
  --shadow: 0 1px 0 rgba(16, 24, 32, .03), 0 1px 3px rgba(16, 24, 32, .06);
  --shadow-lift: 0 2px 4px rgba(16, 24, 32, .06), 0 12px 32px rgba(16, 24, 32, .14);
  --ease: cubic-bezier(.2, .6, .2, 1);
  --t: 140ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1114; --surface: #151a1e; --surface-2: #1b2126; --ink: #e3e8ea; --ink-2: #bac3c8; --muted: #8e99a1;
    --line: #283037; --line-strong: #3d4851; --accent: #4ccde3; --accent-ink: #05222a; --accent-soft: #0f2b32; --focus: #4ccde3;
    --ok: #5fcf88; --ok-bg: #11301d; --warn: #f1b84e; --warn-bg: #33270f; --fail: #ff8a7f; --fail-bg: #3a1715;
    --grid-minor: rgba(76, 205, 227, .05); --grid-major: rgba(76, 205, 227, .10); --readout-bg: #10161a; --hl: #3a3417;
    --term-bg: #0a0e11; --term-bar: #12181c; --term-line: #232d34;
    --shadow: 0 1px 0 rgba(0, 0, 0, .25); --shadow-lift: 0 16px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1114; --surface: #151a1e; --surface-2: #1b2126; --ink: #e3e8ea; --ink-2: #bac3c8; --muted: #8e99a1;
  --line: #283037; --line-strong: #3d4851; --accent: #4ccde3; --accent-ink: #05222a; --accent-soft: #0f2b32; --focus: #4ccde3;
  --ok: #5fcf88; --ok-bg: #11301d; --warn: #f1b84e; --warn-bg: #33270f; --fail: #ff8a7f; --fail-bg: #3a1715;
  --grid-minor: rgba(76, 205, 227, .05); --grid-major: rgba(76, 205, 227, .10); --readout-bg: #10161a; --hl: #3a3417;
  --term-bg: #0a0e11; --term-bar: #12181c; --term-line: #232d34;
  --shadow: 0 1px 0 rgba(0, 0, 0, .25); --shadow-lift: 0 16px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--toolbar-h) + var(--sp-3)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: var(--fs-2)/1.55 var(--sans); font-feature-settings: "kern" 1;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
h1, h2, h3, h4 { line-height: 1.22; margin: 0 0 var(--sp-2); text-wrap: balance; font-weight: 600; letter-spacing: -.005em; }
h1 { font-size: var(--fs-5); }
h2 { font-size: var(--fs-4); }
h3 { font-size: var(--fs-3); }
h4 { font-size: var(--fs-2); }
sub { font-size: .72em; line-height: 0; }
.mono, code, pre { font-family: var(--mono); }
.mono, td.mono, .out-val, input[type="number"] { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-0); }
[hidden] { display: none !important; }
.sr-only { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn:focus-visible, .pill:focus-visible, .slot:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .field:focus-visible, .cell:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
.field:focus, .cell:focus { outline: 2px solid var(--focus); outline-offset: 1px; background: var(--surface); }

/* ---------- toolbar ---------- */
.toolbar {
  position: sticky; top: 0; z-index: 20; min-height: var(--toolbar-h);
  display: flex; flex-wrap: nowrap; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.toolbar::after { /* thin signal rule under the bar */
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, var(--accent) 0 var(--toc-w), transparent var(--toc-w));
  opacity: .6;
}
.brand { display: flex; gap: var(--sp-2); align-items: center; min-width: 0; flex: 1 1 auto; }
.brand-mark { width: 24px; height: 24px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.brand-text { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; }
#brand-id { font-family: var(--mono); font-weight: 600; font-size: var(--fs-1); letter-spacing: -.01em; white-space: nowrap; }
#brand-title { color: var(--muted); font-size: var(--fs-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#brand-title:not(:empty)::before { content: "/"; margin-right: var(--sp-2); color: var(--line-strong); }
.tb-actions, .tb-status { display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.tb-status { padding-left: var(--sp-3); border-left: 1px solid var(--line); }
.save-state { font-size: var(--fs-0); color: var(--muted); white-space: nowrap; }
.save-state:not(:empty)::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 1px; background: var(--line-strong); vertical-align: 1px; }
.btn.toc-toggle { display: none; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; flex: none; }

.btn-group { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-2); padding-left: var(--sp-2); }
.btn-group-lbl { font: 600 10.5px/1 var(--cond); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-right: var(--sp-2); }
.btn-group .btn { border-radius: 0; border-width: 0 0 0 1px; background: var(--surface); }
.btn-group .btn:last-child { border-radius: 0 var(--r-2) var(--r-2) 0; }
.btn-group .btn:hover { background: var(--accent-soft); }

/* ---------- buttons, pills, chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 30px; padding: 0 var(--sp-3);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: var(--r-2); cursor: pointer; font-size: var(--fs-1); font-weight: 500; line-height: 1.2; white-space: nowrap;
  box-shadow: 0 1px 0 rgba(16, 24, 32, .04);
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease);
}
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn:active { transform: translateY(.5px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.danger { color: var(--fail); }
.btn.danger:hover { border-color: color-mix(in srgb, var(--fail) 50%, var(--line)); background: var(--fail-bg); }
.btn.tiny { min-height: 24px; padding: 0 var(--sp-2); font-size: var(--fs-0); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
.btn[aria-pressed="true"]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; min-height: 24px;
  border: 1px solid var(--line); border-radius: 999px; padding: 0 var(--sp-2) 0 7px;
  font: 500 var(--fs-0)/1 var(--mono); letter-spacing: -.01em; white-space: nowrap; background: var(--surface-2); color: var(--ink-2);
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.pill.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.pill.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); animation: pulse 1.1s ease-in-out infinite; }
.pill.fail .dot { background: var(--fail); }
.pill.fail { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, var(--line)); }
.pill.ref { font-family: var(--mono); color: var(--accent); background: var(--accent-soft); border-color: transparent; padding: 0 var(--sp-2); }
button.pill { cursor: pointer; }
@keyframes pulse { 50% { opacity: .35; } }

.chip {
  display: inline-flex; align-items: center; min-height: 22px;
  border-radius: var(--r-1); padding: 0 7px;
  font: 600 11px/1 var(--cond); text-transform: uppercase; letter-spacing: .07em;
  border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
  background: var(--surface-2); color: var(--muted); white-space: nowrap; vertical-align: middle;
}
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.fail { background: var(--fail-bg); color: var(--fail); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
select.chip {
  appearance: none; -webkit-appearance: none; cursor: pointer; min-height: 24px; padding-right: 22px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 11px center, right 7px center; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
}
select.chip option { color: var(--ink); background: var(--surface); text-transform: none; font-family: var(--sans); }
.verify { font-size: var(--fs-0); color: var(--warn); border-bottom: 1px dotted var(--warn); white-space: nowrap; }

/* ---------- layout ---------- */
.layout {
  display: grid; grid-template-columns: var(--toc-w) minmax(0, 1fr); gap: var(--sp-5);
  max-width: 1400px; margin: 0 auto; padding: var(--sp-5) var(--sp-4) var(--sp-6);
}
.toc {
  position: sticky; top: calc(var(--toolbar-h) + var(--sp-4)); align-self: start;
  max-height: calc(100vh - var(--toolbar-h) - var(--sp-5)); overflow: auto; font-size: var(--fs-1);
  padding-right: var(--sp-1); scrollbar-width: thin;
}
.toc::before {
  content: "Contents"; display: block; padding: 0 var(--sp-2) var(--sp-2);
  font: 600 11px/1 var(--cond); text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
}
.toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; border-left: 1px solid var(--line); }
.toc li a {
  position: relative; display: flex; gap: var(--sp-2); align-items: baseline; padding: 5px var(--sp-2) 5px var(--sp-3);
  border-radius: 0 var(--r-2) var(--r-2) 0; text-decoration: none; color: var(--ink-2); line-height: 1.35;
  transition: background-color var(--t) var(--ease), color var(--t) var(--ease);
}
.toc li a:hover { background: var(--surface); color: var(--ink); }
.toc li a.active { color: var(--ink); background: var(--surface); font-weight: 500; }
.toc li a.active::before { content: ""; position: absolute; left: -1px; top: 4px; bottom: 4px; width: 2px; background: var(--accent); border-radius: 2px; }
.toc .num { font: 500 var(--fs-0)/1 var(--mono); color: var(--muted); min-width: 1.8em; flex: none; }
.toc li a.active .num { color: var(--accent); }
.toc .toc-title { flex: 1 1 auto; min-width: 0; }
.toc .prog { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; align-self: center; }
.toc .prog.partial { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
.toc .prog.done { border-color: var(--ok); background: var(--ok); }
.toc .toc-sub a { padding-left: calc(var(--sp-3) + 1.8em + var(--sp-2)); font-size: var(--fs-0); color: var(--muted); }
.doc { min-width: 0; display: flex; flex-direction: column; gap: var(--sp-5); }

/* ---------- masthead ---------- */
.doc-head { display: flex; flex-direction: column; gap: var(--sp-2); padding-bottom: var(--sp-2); }
.doc-eyebrow { display: flex; align-items: center; gap: var(--sp-2); font: 600 11.5px/1 var(--cond); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.doc-eyebrow-sep { width: 18px; height: 1px; background: var(--line-strong); }
.doc-eyebrow span:last-child { color: var(--muted); }
.doc-title { font: 600 var(--fs-5)/1.1 var(--mono); letter-spacing: -.025em; margin: var(--sp-1) 0 0; overflow-wrap: anywhere; }
.doc-sub { margin: 0; font-size: var(--fs-3); color: var(--ink-2); max-width: 70ch; }
.doc-intro { margin: 0; font-size: var(--fs-1); color: var(--muted); max-width: 80ch; }
.doc-head .callout-warn { margin-top: var(--sp-2); max-width: 100%; }

/* ---------- sections & cards ---------- */
.section {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--sp-5) var(--sp-5) var(--sp-5); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: var(--sp-4);
}
.section::before { /* drawing-frame ruler: minor ticks every 10 px, major every 50 px */
  content: ""; position: absolute; top: 0; left: var(--radius); right: var(--radius); height: 7px; pointer-events: none;
  background:
    repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 50px) top left / 100% 7px no-repeat,
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10px) top left / 100% 4px no-repeat;
  opacity: .9;
}
.section > h2 { display: flex; gap: var(--sp-3); align-items: center; margin: 0; font-family: var(--cond); font-size: var(--fs-4); letter-spacing: 0; }
.section > h2 .num {
  display: inline-grid; place-items: center; min-width: 2.4em; height: 1.65em; padding: 0 6px;
  font: 600 var(--fs-1)/1 var(--mono); color: var(--accent); letter-spacing: .02em;
  border: 1.5px solid currentColor; border-radius: var(--r-1); flex: none;
}
.subhead { font: 600 var(--fs-3)/1.25 var(--cond); margin: var(--sp-2) 0 0; display: flex; align-items: center; gap: var(--sp-2); }
.subhead::before { content: ""; width: 10px; height: 2px; background: var(--accent); flex: none; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--sp-3) var(--sp-4) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3);
}
.card .card { background: var(--surface-2); }
.card-head { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.card-head h3, .card-head h4 { margin: 0; margin-right: auto; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--sp-3) var(--sp-4); }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }

.callout-howto {
  position: relative; border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); border-left: 3px solid var(--accent);
  background: var(--accent-soft); color: var(--ink-2);
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-1) var(--r-2) var(--r-2) var(--r-1); font-size: var(--fs-1); max-width: 92ch;
}
.callout-howto::before { content: "How to fill"; display: inline-block; margin-right: var(--sp-2); font: 600 10.5px/1 var(--cond); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); vertical-align: 1px; }
.callout-warn {
  border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); border-left: 3px solid var(--warn); background: var(--warn-bg); color: var(--ink);
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-1) var(--r-2) var(--r-2) var(--r-1); font-size: var(--fs-1);
}

/* ---------- editable fields & placeholders ---------- */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--sp-3) var(--sp-4); }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld > .lbl, .prose-lbl { font: 600 11px/1.3 var(--cond); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.field {
  min-height: 1.75em; padding: 2px var(--sp-1); border-radius: var(--r-1);
  border-bottom: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease);
}
.field:hover { background: var(--surface-2); border-bottom-color: var(--line-strong); }
.field.prose { min-height: 3.2em; }
.field:empty::before, .cell:empty::before { content: attr(data-ph); }
.placeholder, .field:empty::before, .cell:empty::before {
  color: var(--muted); font-style: italic;
  text-decoration: underline dashed color-mix(in srgb, var(--accent) 60%, var(--muted)); text-decoration-thickness: 1px; text-underline-offset: 4px;
}
.field:empty { border-bottom-style: dashed; }

/* KiCad-style title block: §0 Document control header fields */
#s0 > .fields {
  grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line-strong);
  border: 1.5px solid var(--line-strong); border-radius: var(--r-1); overflow: hidden;
}
#s0 > .fields > .fld { background: var(--surface); padding: 7px var(--sp-3) 8px; gap: 2px; grid-column: span 2; }
#s0 > .fields > .fld:nth-child(2) { grid-column: span 4; }
#s0 > .fields > .fld:nth-child(3), #s0 > .fields > .fld:nth-child(4), #s0 > .fields > .fld:nth-child(8) { grid-column: span 1; }
#s0 > .fields > .fld:nth-child(7) { grid-column: span 3; }
#s0 > .fields > .fld:nth-child(10) { grid-column: span 6; }
#s0 > .fields .field { border-bottom: 0; padding-left: 0; padding-right: 0; }
#s0 > .fields .field:hover { background: transparent; box-shadow: inset 0 -1px 0 var(--line-strong); }
#s0 > .fields > .fld:nth-child(1) .field { font: 600 var(--fs-3)/1.4 var(--mono); letter-spacing: -.01em; }
#s0 > .fields > .fld:nth-child(2) .field { font-size: var(--fs-3); font-weight: 500; }
#s0 > .fields > .fld:nth-child(3) .field { font: 600 var(--fs-4)/1.2 var(--mono); }
#s0 > .fields > .fld:nth-child(7) .field, #s0 > .fields > .fld:nth-child(8) .field { font-family: var(--mono); font-size: var(--fs-1); overflow-wrap: anywhere; }
#s0 > .fields > .fld:nth-child(1), #s0 > .fields > .fld:nth-child(2) { background: var(--surface-2); }

/* ---------- tables ---------- */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface); -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
table.etable { border-collapse: collapse; width: 100%; font-size: var(--fs-1); }
.etable th, .etable td { border-bottom: 1px solid var(--line); padding: 6px var(--sp-2); text-align: left; vertical-align: top; }
.etable tbody tr:last-child td { border-bottom: 0; }
.etable th {
  background: var(--surface-2); font: 600 11px/1.3 var(--cond); text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  white-space: nowrap; position: sticky; top: 0; border-bottom: 1px solid var(--line-strong);
}
.etable td + td, .etable th + th { border-left: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.etable .cell { min-width: 5em; white-space: pre-wrap; border-radius: var(--r-1); }
.etable span.cell { display: inline-block; min-width: 8em; max-width: calc(100% - 1.4em); vertical-align: top; }
.etable .cell.mono { font-family: var(--mono); font-size: 12.5px; }
.etable .cell-wrap .cell { font-size: var(--fs-0); word-break: break-all; }
.etable td.cell-wrap { min-width: 21em; }
.etable td.cell { min-width: 9.5em; }
.etable td.cell:not(.mono) { max-width: 26em; }
.etable td.act { width: 1%; white-space: nowrap; }
.etable td.act .btn.tiny { min-height: 22px; width: 22px; padding: 0; color: var(--muted); border-color: transparent; background: transparent; box-shadow: none; }
.etable tr:hover td.act .btn.tiny { border-color: var(--line); }
.etable td.act .btn.tiny:hover { color: var(--fail); background: var(--fail-bg); }
.etable tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.etable input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); margin: 2px 0 0; }
.etable .cell-link { margin-left: var(--sp-1); text-decoration: none; }
.etable td.mono { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.etable td.mono .chip { margin-left: 4px; }
.table-caption { font: 600 var(--fs-1)/1.3 var(--cond); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }

/* ---------- image slots / excerpts ---------- */
.slot {
  border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-2); align-items: stretch; margin: 0;
  background:
    linear-gradient(var(--grid-minor) 1px, transparent 1px) 0 0 / 12px 12px,
    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px) 0 0 / 12px 12px;
  transition: border-color var(--t) var(--ease), background-color var(--t) var(--ease);
}
.slot:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line-strong)); }
.slot.drag { border-color: var(--accent); background-color: var(--accent-soft); }
.slot[data-filled] { border-style: solid; border-color: var(--line); background: var(--surface); }
.slot-drop { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); padding: var(--sp-4); color: var(--muted); text-align: center; font-size: var(--fs-1); }
.slot-drop.placeholder { text-decoration: none; font-style: normal; }
.slot-drop.placeholder > div:first-child { font-style: italic; text-decoration: underline dashed color-mix(in srgb, var(--accent) 60%, var(--muted)); text-underline-offset: 4px; }
.slot img { max-width: 100%; height: auto; border-radius: var(--r-1); background: #fff; align-self: center; box-shadow: 0 0 0 1px var(--line); }
.slot figcaption { font-size: var(--fs-1); display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.slot figcaption strong { font: 600 11px/1.3 var(--cond); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.excerpt { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--sp-4); }
.excerpt .caption-out { font-size: var(--fs-1); font-style: italic; color: var(--muted); }
.excerpt .x-fields { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.excerpt .x-full { grid-column: 1 / -1; }
select.apply-to { border: 1px solid var(--line); border-radius: var(--r-1); background: var(--surface); font-size: var(--fs-0); padding: 2px 4px; max-width: 12em; }

/* ---------- ADR ---------- */
.adr .fields { grid-template-columns: 1fr; }
.adr .card-head h4 { font-family: var(--mono); font-size: var(--fs-1); }

/* ---------- calculators (instrument panel) ---------- */
.calc { position: relative; padding: 0; gap: 0; overflow: hidden; border-color: var(--line); box-shadow: var(--shadow); }
.calc > * { margin: 0 var(--sp-4); }
.calc > .card-head {
  margin: 0; padding: var(--sp-3) var(--sp-4) var(--sp-2);
  border-top: 3px solid var(--accent);
}
.calc > .card-head h4 { font: 600 var(--fs-3)/1.25 var(--cond); }
.calc-num { font: 600 var(--fs-1)/1 var(--mono); color: var(--accent); margin-right: 4px; }
.calc-src { font-size: var(--fs-0); color: var(--muted); margin-bottom: var(--sp-3); }
.calc-eq {
  overflow-x: auto; padding: var(--sp-3) var(--sp-3); border-radius: var(--r-2); text-align: center; min-height: 3.2em;
  border: 1px solid var(--line);
  background:
    linear-gradient(var(--grid-major) 1px, transparent 1px) -1px -1px / 50px 50px,
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px) -1px -1px / 50px 50px,
    linear-gradient(var(--grid-minor) 1px, transparent 1px) -1px -1px / 10px 10px,
    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px) -1px -1px / 10px 10px,
    var(--surface-2);
  color: var(--ink);
}
.calc-eq svg { max-width: 100%; }
.calc-eq.raw { font-family: var(--mono); font-size: var(--fs-1); text-align: left; white-space: pre-wrap; color: var(--ink-2); }
.calc-body {
  display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--sp-4);
  margin-top: var(--sp-4); align-items: start;
}
.calc-inputs { display: flex; flex-direction: column; gap: var(--sp-3); }
.calc-in { display: grid; grid-template-columns: minmax(80px, 9em) minmax(80px, 1fr) 6.5em minmax(2.5em, auto); gap: 4px var(--sp-3); align-items: center; font-size: var(--fs-1); }
.calc-in label { overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: var(--ink); }
.calc-in input[type="number"], .calc-in select {
  width: 100%; height: 30px; padding: 0 var(--sp-2); border: 1px solid var(--line-strong); border-radius: var(--r-1);
  background: var(--readout-bg); font: 500 var(--fs-1) var(--mono); text-align: right; color: var(--ink);
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.calc-in select { text-align: left; font-family: var(--sans); }
.calc-in input[type="number"]:hover { border-color: var(--accent); }
.calc-in input[type="number"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.calc-in .unit, .out .unit { color: var(--muted); font: 500 var(--fs-0) var(--mono); }
.calc-in .tol, .calc-in .bind { grid-column: 2 / -1; font-size: var(--fs-0); color: var(--muted); line-height: 1.4; }
.calc-in .bind { color: var(--accent); }
.calc-in .bind::before { content: "↳ "; }

/* fader-style range input */
.calc-in input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; margin: 0; }
.calc-in input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background:
    repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 10%) center / 100% 4px no-repeat,
    var(--line);
}
.calc-in input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
.calc-in input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
.calc-in input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 12px; height: 20px; margin-top: -8px; border-radius: 2px;
  background: linear-gradient(var(--accent-ink), var(--accent-ink)) center / 6px 2px no-repeat, var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 70%, var(--ink));
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform var(--t) var(--ease);
}
.calc-in input[type="range"]::-moz-range-thumb {
  width: 12px; height: 20px; border-radius: 2px; background: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 70%, var(--ink));
}
.calc-in input[type="range"]:hover::-webkit-slider-thumb { transform: scaleY(1.08); }
.calc-in input[type="range"]:focus-visible { outline: none; }
.calc-in input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 40%, transparent); }

/* readout column */
.calc-out {
  display: grid; grid-template-columns: minmax(70px, 1fr) auto auto auto; column-gap: var(--sp-2); padding: var(--sp-1) var(--sp-3) var(--sp-2);
  background: var(--readout-bg); border: 1px solid var(--line); border-radius: var(--r-2);
}
.calc-out::before {
  content: "Readout"; display: block; padding: var(--sp-2) 0 var(--sp-1);
  font: 600 10.5px/1 var(--cond); text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  border-bottom: 1px solid var(--line); grid-column: 1 / -1;
}
.out {
  grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: baseline;
  padding: var(--sp-2) 0; border-bottom: 1px dashed var(--line);
}
.out:last-child { border-bottom: 0; }
.out-label { font-size: var(--fs-1); color: var(--ink-2); }
.out-val { font: 600 var(--fs-out)/1.1 var(--mono); text-align: right; letter-spacing: -.02em; color: var(--ink); transition: opacity var(--t) var(--ease); }
.out .chip { justify-self: end; align-self: center; }
.out .unit { align-self: baseline; }
.out:has(.chip.fail) .out-val { color: var(--fail); }
.out:has(.chip.warn) .out-val { color: var(--warn); }
.calc.pending .out-val { opacity: .35; }
.calc-msg { font-size: var(--fs-1); }
.calc-msg:empty { display: none; }
.calc > .calc-msg { margin-top: var(--sp-3); }
.calc-msg.err { color: var(--fail); white-space: pre-wrap; font-family: var(--mono); font-size: var(--fs-0); background: var(--fail-bg); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-2); border-left: 3px solid var(--fail); }
.calc-msg.na { color: var(--muted); font-style: italic; }

.calc-actions {
  display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center;
  margin: var(--sp-4) 0 0 !important; padding: var(--sp-2) var(--sp-4);
  background: var(--surface-2); border-top: 1px solid var(--line);
}
.calc > .calc-actions { order: 5; }
.calc-notes { font-size: var(--fs-1); color: var(--muted); margin: var(--sp-3) var(--sp-4) 0; max-width: 90ch; }

/* worst-case panel */
.calc-wca { margin-top: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface); }
.calc-wca::before { content: "Worst-case · EVA / RSS / Monte-Carlo"; display: block; margin-bottom: var(--sp-2); font: 600 10.5px/1 var(--cond); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.calc-wca table { font-size: var(--fs-0); }
.calc-wca .hist {
  width: 100%; max-width: 420px; height: 84px; display: block; padding: 6px 0 0; border-radius: var(--r-1);
  background:
    linear-gradient(var(--grid-minor) 1px, transparent 1px) 0 0 / 100% 21px,
    var(--readout-bg);
  border: 1px solid var(--line);
}
.calc-wca .hist rect { fill: var(--accent); opacity: .8; }
.calc-wca .hist line.base { stroke: var(--line-strong); stroke-width: 1; }
.calc-wca .hist line.lim { stroke: var(--fail); stroke-width: 1.5; stroke-dasharray: 3 2; }
.calc-table { margin-top: var(--sp-1); }
.calc-links { font-size: var(--fs-1); margin: 0; }

/* ---------- code reveal (terminal) ---------- */
.code-reveal {
  margin-top: var(--sp-3) !important; border: 1px solid var(--term-line); border-radius: var(--r-2);
  background: var(--term-bg); color: var(--term-fg); overflow: hidden; color-scheme: dark;
}
.code-reveal .code-bar {
  display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; padding: 0 var(--sp-2) 0 0;
  background: var(--term-bar); border-bottom: 1px solid var(--term-line); font-size: var(--fs-0); color: var(--term-muted); min-height: 36px;
}
.code-reveal .code-bar::before {
  content: "Python"; align-self: stretch; display: flex; align-items: center; gap: 6px; padding: 0 var(--sp-3);
  font: 600 var(--fs-0)/1 var(--mono); color: var(--term-fg); background: var(--term-bg);
  border-right: 1px solid var(--term-line); box-shadow: inset 0 2px 0 var(--tok-kw);
}
.code-reveal .code-bar .grow { margin-right: auto; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.code-reveal .btn { background: transparent; color: var(--term-fg); border-color: var(--term-line); box-shadow: none; }
.code-reveal .btn:hover { background: #1f2930; border-color: #3a4852; }
.code-reveal .btn.primary { background: var(--tok-kw); color: #062028; border-color: var(--tok-kw); }
.code-reveal pre {
  margin: 0; padding: var(--sp-3) var(--sp-4); overflow: auto; font-size: var(--fs-1); line-height: 1.6; max-height: 460px; tab-size: 4;
  background:
    linear-gradient(90deg, transparent calc(4ch + var(--sp-4)), transparent 0);
}
.code-reveal textarea {
  display: block; width: 100%; min-height: 260px; border: 0; padding: var(--sp-3) var(--sp-4); margin: 0;
  background: var(--term-bg); color: var(--term-fg); caret-color: var(--tok-kw);
  font-family: var(--mono); font-size: var(--fs-1); line-height: 1.6; resize: vertical; tab-size: 4;
}
.code-reveal textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--tok-kw); }
.tok-kw { color: var(--tok-kw); font-weight: 600; }
.tok-str { color: var(--tok-str); }
.tok-num { color: var(--tok-num); }
.tok-com { color: var(--tok-com); font-style: italic; }
.tok-fn { color: var(--tok-fn); }

/* ---------- new-calculator zone ---------- */
.newcalc { border-style: dashed; border-width: 1.5px; border-color: var(--line-strong); background: var(--surface-2); }
.newcalc > .card-head h3 { font-family: var(--cond); }
.newcalc .slot { background-color: var(--surface); }
.newcalc textarea, .newcalc input[type="text"], .modal textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-2); background: var(--surface); padding: var(--sp-2); font-family: var(--mono); font-size: var(--fs-1);
}
.newcalc input[type="text"] { font-family: var(--sans); min-height: 32px; }
.newcalc textarea:focus, .newcalc input[type="text"]:focus, .modal textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.newcalc details { border-top: 1px solid var(--line); padding-top: var(--sp-3); }
.newcalc summary { cursor: pointer; font-weight: 500; color: var(--ink-2); }
.newcalc summary:hover { color: var(--accent); }
.newcalc .tabs { display: flex; gap: var(--sp-2); }

/* ---------- analyses ---------- */
.analysis { position: relative; border-left: 3px solid var(--line-strong); padding-left: calc(var(--sp-4) - 2px); }
.analysis:has(> .card-head select.chip.ok) { border-left-color: var(--ok); }
.analysis:has(> .card-head select.chip.warn) { border-left-color: var(--warn); }
.analysis:has(> .card-head select.chip.fail) { border-left-color: var(--fail); }
.analysis > .card-head h3 { font: 600 var(--fs-3)/1.3 var(--cond); display: flex; align-items: baseline; gap: var(--sp-2); }
.an-id { font: 600 var(--fs-0)/1 var(--mono); color: var(--accent); border: 1px solid currentColor; border-radius: var(--r-1); padding: 3px 5px; flex: none; position: relative; top: -1px; }
.analysis.na { background: var(--surface-2); border-left-style: dashed; }
.analysis.na > .card-head h3 { color: var(--muted); }
.analysis.na > .an-body { display: none; }
.analysis .an-why { font-size: var(--fs-1); color: var(--muted); margin: 0; max-width: 95ch; }
.an-ctl { display: flex; gap: var(--sp-2); align-items: center; }
.an-ctl select:not(.chip) {
  appearance: none; -webkit-appearance: none; border: 1px solid var(--line); border-radius: var(--r-1); background-color: var(--surface);
  min-height: 24px; padding: 0 22px 0 7px; font: 500 var(--fs-0)/1 var(--sans); cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 11px center, right 7px center; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
}
.an-body { display: flex; flex-direction: column; gap: var(--sp-3); }
.an-body .calc { margin-top: var(--sp-1); }

/* ---------- modal & toast ---------- */
.modal-back {
  position: fixed; inset: 0; background: color-mix(in srgb, #05090c 55%, transparent); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: var(--sp-4);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade var(--t) var(--ease);
}
.modal {
  background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: var(--radius);
  width: min(960px, 100%); max-height: 90vh; display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5);
  box-shadow: var(--shadow-lift); animation: rise 180ms var(--ease);
}
.modal h3 { font-family: var(--cond); font-size: var(--fs-4); }
.modal textarea { flex: 1; min-height: 50vh; white-space: pre; background: var(--surface-2); line-height: 1.5; }
.modal .modal-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; flex-wrap: wrap; padding-top: var(--sp-2); border-top: 1px solid var(--line); }
.toast-host { position: fixed; bottom: var(--sp-4); right: var(--sp-4); z-index: 60; display: flex; flex-direction: column; gap: var(--sp-2); }
.toast {
  background: var(--ink); color: var(--paper); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-2); font-size: var(--fs-1);
  max-width: 380px; box-shadow: var(--shadow-lift); border-left: 3px solid var(--accent); animation: rise 180ms var(--ease);
}
.toast.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-left-width: 3px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

/* ---------- responsive ---------- */
@media (max-width: 1380px) {
  #brand-title { display: none; }
}
@media (max-width: 1100px) {
  .save-state { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}
@media (max-width: 1000px) {
  :root { --toc-w: 200px; }
  .layout { gap: var(--sp-4); }
  .section { padding: var(--sp-4); }
  .tb-actions .btn-group-lbl { display: none; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding: var(--sp-3) var(--sp-3) var(--sp-5); }
  .toolbar::after { display: none; }
  .toc {
    position: static; max-height: none; display: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: var(--sp-3) var(--sp-2); box-shadow: var(--shadow-lift);
  }
  .toc.open { display: block; animation: rise 160ms var(--ease); }
  .btn.toc-toggle { display: inline-flex; }
  .toc-toggle[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .calc-body, .excerpt { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  :root { --toolbar-h: 96px; --fs-5: 24px; --fs-4: 19px; --fs-out: 22px; }
  html { scroll-padding-top: 108px; }
  .toolbar { flex-wrap: wrap; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); }
  .brand { order: 1; flex: 1 1 0; }
  .toc-toggle { order: 0; }
  .tb-status { order: 2; border-left: 0; padding-left: 0; gap: 6px; }
  .tb-status .pill { padding: 0 7px; }
  .tb-status .pill .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tb-actions {

      Markdown + marimo generators. No DOM access (tested under node).

const STORE_KEY = "dbdoc.v1.state";
const IMG_PREFIX = "dbdoc.v1.img.";
const MARIMO_VERSION = "0.25.2";

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Label "V_IH(min) pin" -> V<sub>IH(min)</sub> pin (first underscore only). */
function labelHtml(lbl) {
  const s = esc(lbl);
  return s.replace(/([A-Za-zΨθτλεΔ])_(\{[^}]*\}|[A-Za-z0-9(),.\-]+)/, (m, a, b) => a + "<sub>" + b.replace(/[{}]/g, "") + "</sub>");
}

/* Python-style number formatting for fmt strings like ".3f", "+.1f", ".4g", ".2e", ".0f". */
function fmtNum(v, fmt) {
  if (typeof v !== "number") return String(v);
  if (!isFinite(v)) return isNaN(v) ? "NaN" : (v > 0 ? "∞" : "−∞");
  const m = /^([+\- ])?(?:\.(\d+))?([fegd%])?$/.exec(fmt || ".4g") || [null, "", "4", "g"];
  const sign = m[1] === "+", p = m[2] != null ? +m[2] : 6, k = m[3] || "g";
  let s;
  if (k === "f") s = v.toFixed(p);
  else if (k === "e") s = v.toExponential(p);
  else if (k === "%") s = (v * 100).toFixed(p) + "%";
  else if (k === "d") s = Math.round(v).toString();
  else {
    const pp = Math.max(1, p), a = Math.abs(v);
    if (a !== 0 && (a < 1e-4 || a >= Math.pow(10, pp))) s = v.toExponential(pp - 1).replace(/\.?0+e/, "e");
    else s = String(Number(v.toPrecision(pp)));
  }
  if (sign && v >= 0) s = "+" + s;
  return s.replace(/^-/, "−");
}

/* Evaluate a limit {min,max,warn_min,warn_max} -> "ok" | "warn" | "fail" | "" */
function limitState(v, lim) {
  if (!lim || typeof v !== "number" || isNaN(v)) return "";
  if ((lim.min != null && v < lim.min) || (lim.max != null && v > lim.max)) return "fail";
  if ((lim.warn_min != null && v < lim.warn_min) || (lim.warn_max != null && v > lim.warn_max)) return "warn";
  return "ok";
}

/* Tiny Python highlighter -> HTML. */
const PY_KW = new Set("def return if elif else for in while import from as and or not None True False lambda try except finally with class pass raise break continue global yield is assert del".split(" "));
const PY_BUILTIN = new Set("min max abs float int len range sum dict list str round print zip enumerate sorted pow isinstance".split(" "));
function highlightPy(src) {
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+\.?\d*(?:[eE][+-]?\d+)?\b|\B\.\d+(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += '<span class="tok-com">' + esc(t) + "</span>";
    else if (m[2]) out += '<span class="tok-str">' + esc(t) + "</span>";
    else if (m[3]) out += '<span class="tok-num">' + esc(t) + "</span>";
    else if (PY_KW.has(t)) out += '<span class="tok-kw">' + t + "</span>";
    else if (PY_BUILTIN.has(t) || /^\s*\(/.test(src.slice(re.lastIndex, re.lastIndex + 2))) out += '<span class="tok-fn">' + esc(t) + "</span>";
    else out += esc(t);
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* Unit -> SI scale factor (for BOM value comparison). */
function unitScale(u) {
  const t = { "Ω": 1, "kΩ": 1e3, "MΩ": 1e6, "mΩ": 1e-3, "pF": 1e-12, "nF": 1e-9, "µF": 1e-6, "uF": 1e-6, "nH": 1e-9, "µH": 1e-6, "uH": 1e-6, "V": 1, "mV": 1e-3 };
  return t[u] != null ? t[u] : 1;
}

const PY_IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;
const PY_RESERVED = new Set([...PY_KW, "calc", "mo", "math", "np", "numpy"]);

/* Validate + normalise an AI/manual calculator spec. Returns {ok, errors, warnings, spec}. */
function validateSpec(o) {
  const errors = [], warnings = [];
  if (!o || typeof o !== "object" || Array.isArray(o)) return { ok: false, errors: ["Response is not a JSON object"], warnings, spec: null };
  const num = (x, d) => (typeof x === "number" && isFinite(x)) ? x : (typeof x === "string" && x.trim() !== "" && isFinite(+x) ? +x : d);
  const spec = {};
  spec.title = String(o.title || "Untitled calculator").slice(0, 120);
  let id = String(o.id || spec.title).toLowerCase().replace(/[^a-z0-9_]+/g, "_").replace(/^_+|_+$/g, "");
  if (!/^[a-z_]/.test(id)) id = "c_" + id;
  spec.id = id.slice(0, 40) || "custom_calc";
  spec.analysis_ref = /^A([1-9]|1[0-8])$/.test(String(o.analysis_ref || "").trim()) ? String(o.analysis_ref).trim() : "";
  spec.latex = String(o.latex || "");
  spec.source = String(o.source || "");
  spec.notes = String(o.notes || "");
  spec.python = String(o.python || "");
  spec.home = "s5";
  if (!/^\s*def\s+calc\s*\(/m.test(spec.python)) errors.push("python must define def calc(...)");
  if (!Array.isArray(o.inputs) || o.inputs.length === 0) errors.push("inputs must be a non-empty array");
  if (!Array.isArray(o.outputs) || o.outputs.length === 0) errors.push("outputs must be a non-empty array");
  const seen = new Set();
  spec.inputs = (Array.isArray(o.inputs) ? o.inputs : []).slice(0, 24).map((i, n) => {
    const name = String((i && i.name) || "");
    if (!PY_IDENT.test(name) || PY_RESERVED.has(name)) errors.push(`input ${n + 1}: invalid name "${name}"`);
    if (seen.has(name)) errors.push(`duplicate name "${name}"`); seen.add(name);
    let min = num(i.min, 0), max = num(i.max, NaN), value = num(i.value, NaN);
    if (isNaN(value)) value = isNaN(max) ? 1 : (min + max) / 2;
    if (isNaN(max) || max <= min) { max = Math.max(min + 1, Math.abs(value) * 10 || 10); warnings.push(`input ${name}: max fixed to ${max}`); }
    if (value < min) min = value; if (value > max) max = value;
    let step = num(i.step, 0); if (!(step > 0)) step = +((max - min) / 200).toPrecision(2);
    const r = { name, label: String(i.label || name), unit: String(i.unit || ""), min, max, step, value };
    const tol = num(i.tol_pct, 0); if (tol > 0 && tol <= 50) r.tol_pct = tol;
    if (i.desc) r.desc = String(i.desc);
    return r;
  });
  spec.outputs = (Array.isArray(o.outputs) ? o.outputs : []).slice(0, 16).map((q, n) => {
    const name = String((q && q.name) || "");
    if (!PY_IDENT.test(name)) errors.push(`output ${n + 1}: invalid name "${name}"`);
    const fmt = /^[+\- ]?(\.\d{1,2})?[fegd%]?$/.test(String(q.fmt || "")) && q.fmt ? String(q.fmt) : ".4g";
    const r = { name, label: String(q.label || name), unit: String(q.unit || ""), fmt };
    if (q.limit && typeof q.limit === "object") {
      const lim = {};
      for (const k of ["min", "max", "warn_min", "warn_max"]) { const v = num(q.limit[k], NaN); if (!isNaN(v)) lim[k] = v; }
      if (Object.keys(lim).length) r.limit = lim;
    }
    if (q.desc) r.desc = String(q.desc);
    return r;
  });
  const sig = /def\s+calc\s*\(([^)]*)\)/.exec(spec.python);
  if (sig && !/\*\*/.test(sig[1])) {
    const params = sig[1].split(",").map(s => s.split("=")[0].split(":")[0].trim()).filter(Boolean);
    for (const i of spec.inputs) if (!params.includes(i.name)) errors.push(`calc() has no parameter "${i.name}"`);
  }
  return { ok: errors.length === 0, errors, warnings, spec };
}

function exampleState() {
  const st = { v: 1, f: {}, t: {}, adr: [], ex: [], ci: {}, cs: {}, custom: [], bind: {}, tin: {} };
  for (const s of DOC) for (const b of s.blocks) {
    if (b.t === "fields") for (const it of b.items) st.f[it.k] = it.ex || "";
    if (b.t === "prose") st.f[b.k] = b.ex || "";
    if (b.t === "table") st.t[b.key] = JSON.parse(JSON.stringify(b.ex || []));
    if (b.t === "adrs") st.adr = JSON.parse(JSON.stringify(b.ex || []));
    if (b.t === "excerpts") st.ex = JSON.parse(JSON.stringify(EXAMPLE_EXCERPTS));
  }
  for (const a of ANALYSES) {
    const e = a.ex || {};
    st.f[a.id + ".appl"] = e.appl || "Required";
    st.f[a.id + ".just"] = e.just || "";
    st.f[a.id + ".status"] = e.status || "Not started";
    for (const k of ["inputs", "results", "margin"]) st.f[a.id + "." + k] = e[k] || "";
    if (a.table) st.t[a.table.key] = JSON.parse(JSON.stringify(a.table.ex || []));
    if (a.table2) st.t[a.table2.key] = JSON.parse(JSON.stringify(a.table2.ex || []));
  }
  return st;
}

function blankState(prev) {
  const ex = exampleState();
  const st = { v: 1, f: {}, t: {}, adr: [], ex: [], ci: {}, cs: {}, custom: (prev && prev.custom) || [], bind: {}, tin: {} };
  for (const s of DOC) for (const b of s.blocks) if (b.t === "fields") for (const it of b.items) if (it.type === "chip") st.f[it.k] = it.opts[0];
  for (const a of ANALYSES) { st.f[a.id + ".appl"] = "Required"; st.f[a.id + ".status"] = "Not started"; }
  for (const b of tableBlocks()) {
    const rows = ex.t[b.key] || [];
    if (b.keep) st.t[b.key] = rows.map(r => r.map((c, i) => (b.cols[i].type === "check" ? "" : c)));
    else if (b.blankKeepCol0) st.t[b.key] = rows.map(r => r.map((c, i) => (i === 0 ? c : (b.cols[i].type === "chip" ? b.cols[i].opts[0] : ""))));
    else st.t[b.key] = [b.cols.map(c => (c.type === "chip" ? c.opts[0] : ""))];
  }
  return st;
}

/* Effective calculator list: built-ins + custom, with current source & inputs. */
function effectiveCalcs(state) {
  return CALCULATORS.concat(state.custom || []).map(c => ({
    spec: c,
    src: (state.cs && state.cs[c.id]) || c.python,
    values: Object.assign({}, ...c.inputs.map(i => ({ [i.name]: i.value })), (state.ci && state.ci[c.id]) || {}),
    rows: (c.table && ((state.tin && state.tin[c.id]) || c.table.rows)) || null
  }));
}

function excerptCaption(x) {
  const parts = [];
  parts.push("© " + (x.mfr || "Manufacturer") + " — " + (x.doc || "Doc ID") + " Rev " + (x.rev || "?") + (x.date ? " (" + x.date + ")" : ""));
  if (x.page) parts.push("p." + x.page);
  if (x.fig) parts.push(/^(fig|table|tab)/i.test(x.fig) ? x.fig : "Fig. " + x.fig);
  let s = parts.join(", ");
  if (x.cond) s += " — " + x.cond;
  return s;
}

/* ---------------- numbering ---------------- */
function calcNumbering(state) {
  const map = {};
  let n = 0;
  for (const c of effectiveCalcs(state)) if (c.spec.home === "s5") map[c.spec.id] = "5." + (++n);
  for (const a of ANALYSES) (a.calcs || []).forEach((id, i) => { map[id] = a.id + (a.calcs.length > 1 ? "." + (i + 1) : ""); });
  return map;
}

/* ---------------- Markdown export ---------------- */
function mdCell(s) { return String(s == null ? "" : s).replace(/\|/g, "\\|").replace(/\r?\n/g, "<br>"); }
function mdTable(cols, rows) {
  const h = "| " + cols.map(c => mdCell(c.h)).join(" | ") + " |\n|" + cols.map(() => "---").join("|") + "|\n";
  return h + (rows || []).map(r => "| " + cols.map((c, i) => c.type === "check" ? (r[i] ? "☑" : "☐") : mdCell(r[i])).join(" | ") + " |").join("\n") + "\n";
}
function mdFields(items, f) {
  return "| Field | Value |\n|---|---|\n" + items.map(it => "| " + mdCell(it.label) + " | " + mdCell(f[it.k] || "_(" + (it.ph || "to fill") + ")_") + " |").join("\n") + "\n";
}
function mdCalc(c, num, results) {
  const s = c.spec, r = results && results[s.id];
  let o = `#### ${num || ""} ${s.title}  \`${s.id}\`\n\n`;
  if (s.analysis_ref) o += `Analysis: ${s.analysis_ref}. `;
  if (s.source) o += `Source: ${s.source}`;
  o += "\n\n$$\n" + s.latex + "\n$$\n\n";
  o += "| Input | Value | Unit | Tol |\n|---|---|---|---|\n" + s.inputs.map(i => `| ${mdCell(i.label)} | ${c.values[i.name]} | ${mdCell(i.unit)} | ${i.tol_pct ? "±" + i.tol_pct + " %" : ""} |`).join("\n") + "\n\n";
  if (r && !r.error) o += "| Output | Value | Unit | Check |\n|---|---|---|---|\n" + s.outputs.map(q => `| ${mdCell(q.label)} | ${r[q.name] != null ? fmtNum(r[q.name], q.fmt) : ""} | ${mdCell(q.unit)} | ${limitState(r[q.name], q.limit).toUpperCase()} |`).join("\n") + "\n\n";
  else o += "_Outputs not computed in this export (Python runtime not run)._\n\n";
  o += "```python\n" + c.src.replace(/\s+$/, "") + "\n```\n\n";
  if (s.notes) o += "> " + s.notes + "\n\n";
  return o;
}
function buildMarkdown(state, results) {
  const f = state.f, calcs = effectiveCalcs(state), nums = calcNumbering(state);
  const byId = Object.fromEntries(calcs.map(c => [c.spec.id, c]));
  let o = `# ${f.block_id || "Design block"} — ${f.block_title || ""}\n\n`;
  DOC.forEach((s, si) => {
    o += `## ${si}. ${s.title}\n\n> How to fill: ${s.howto}\n\n`;
    for (const b of s.blocks) o += mdBlock(b, state, calcs, nums, results, byId);
  });
  return o;
}
function mdBlock(b, state, calcs, nums, results, byId) {
  const f = state.f;
  switch (b.t) {
    case "fields": return mdFields(b.items, f) + "\n";
    case "prose": return `**${b.label}**\n\n${f[b.k] || "_(" + b.ph + ")_"}\n\n`;
    case "table": return `**${b.title}**\n\n` + mdTable(b.cols, state.t[b.key]) + "\n";
    case "image": return `![${b.label}](public/${b.k}.png)\n\n_${b.label}: save the image as public/${b.k}.png_\n\n`;
    case "adrs": return `### ${b.title}\n\n` + (state.adr || []).map(a => `#### ${a.id || "ADR"} (${a.status || "Proposed"})\n\n- **Context:** ${a.context || ""}\n- **Decision:** ${a.decision || ""}\n- **Consequences:** ${a.consequences || ""}\n- **Rejected alternatives:** ${a.rejected || ""}\n`).join("\n") + "\n";
    case "excerpts": return "### Datasheet excerpts\n\n" + (state.ex || []).map(x => `![${excerptCaption(x)}](public/${x.id}.png)\n\n*${excerptCaption(x)}*\n\n` + mdTable([{ h: "Parameter" }, { h: "Min" }, { h: "Typ" }, { h: "Max" }, { h: "Unit" }, { h: "Cite" }], x.rows) + "\n").join("");
    case "calcs": return calcs.filter(c => c.spec.home === b.home).map(c => mdCalc(c, nums[c.spec.id], results)).join("");
    case "newcalc": return "";
    case "analyses": return ANALYSES.map(a => {
      let t = analysisMd(a, state, nums, byId);
      if (f[a.id + ".appl"] !== "N/A") for (const id of a.calcs || []) if (byId[id]) t += mdCalc(byId[id], nums[id], results);
      return t + "\n";
    }).join("");
  }
  return "";
}

/* ---------------- marimo export ---------------- */
/* Python string literal: raw triple-quoted when safe, else JSON (valid Python). */
function pyRaw(s, q) {
  q = q || '"""';
  s = String(s);
  /* Lines after the first are prefixed with \u0001 so indent() leaves them at column 0
     (indentation inside a string literal would change its value). */
  if (!s.includes(q) && !/\\$/.test(s) && !s.includes(q[0] + q[0] + q[0])) return "r" + q + s.split("\n").join("\n\u0001") + q;
  return JSON.stringify(s);
}
function pyLit(v) {
  if (v == null) return "None";
  if (typeof v === "number") return isFinite(v) ? String(v) : "float('nan')";
  if (typeof v === "boolean") return v ? "True" : "False";
  if (typeof v === "string") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(pyLit).join(", ") + "]";
  return "{" + Object.entries(v).map(([k, x]) => JSON.stringify(k) + ": " + pyLit(x)).join(", ") + "}";
}
function indent(s, n) { const p = " ".repeat(n); return s.split("\n").map(l => (l[0] === "\u0001" ? l : l ? p + l : l)).join("\n"); }
function unmark(s) { return s.replace(/\u0001/g, ""); }
function cell(args, body, ret) {
  return "@app.cell\ndef _(" + args.join(", ") + "):\n" + indent(body.replace(/\s+$/, ""), 4) + "\n    return" + (ret && ret.length ? " (" + ret.join(", ") + (ret.length === 1 ? "," : "") + ")" : "") + "\n";
}
function mdCellPy(md) { return cell(["mo"], "mo.md(\n" + indent(pyRaw("\n" + md.replace(/\s+$/, "") + "\n"), 4) + "\n)"); }
function pyVar(id) { return id.replace(/[^A-Za-z0-9_]/g, "_"); }

/* Two (or three) marimo cells for one calculator. Self-contained (no helper cell needed). */
function marimoCalcCells(c, num) {
  const s = c.spec, v = pyVar(s.id);
  const ctrls = s.inputs.map(i => {
    const lbl = i.label + (i.unit ? " [" + i.unit + "]" : "");
    const val = c.values[i.name];
    if (i.options) {
      const cur = (i.options.find(o => o.value === val) || i.options[0]).label;
      return `${JSON.stringify(i.name)}: mo.ui.dropdown(options=${pyLit(Object.fromEntries(i.options.map(o => [o.label, o.value])))}, value=${JSON.stringify(cur)}, label=${JSON.stringify(lbl)}),`;
    }
    const lo = Math.min(i.min, val), hi = Math.max(i.max, val);
    return `${JSON.stringify(i.name)}: mo.ui.slider(${lo}, ${hi}, step=${i.step}, value=${val}, label=${JSON.stringify(lbl)}, show_value=True, include_input=True),`;
  });
  const tols = s.inputs.filter(i => i.tol_pct);
  const head = `### ${num ? num + " " : ""}${s.title}\n\n$$\n${s.latex}\n$$\n\n` + (s.source ? `*Source: ${s.source}*` : "") + (s.analysis_ref ? `  \nAnalysis: ${s.analysis_ref}` : "");
  let b1 = `${v}_src = ${pyRaw(c.src.replace(/\s*$/, "\n"), "'''")}\n${v}_ui = mo.ui.dictionary({\n${indent(ctrls.join("\n"), 4)}\n})\n`;
  const ret = [v + "_src", v + "_ui"];
  const disp = ["mo.md(" + pyRaw("\n" + head + "\n") + ")", v + "_ui"];
  if (c.rows) {
    const t = s.table;
    const data = c.rows.map(r => Object.fromEntries(t.cols.map((col, k) => [col.name, col.type === "num" ? +r[k] : String(r[k])])));
    b1 += `${v}_table = mo.ui.data_editor(data=${pyLit(data)}, label=${JSON.stringify(t.label)})\n`;
    ret.push(v + "_table"); disp.push(v + "_table");
  }
  if (tols.length) { b1 += `${v}_wc = mo.ui.switch(label="Worst-case (EVA corners)")\n`; ret.push(v + "_wc"); disp.push(v + "_wc"); }
  b1 += `mo.vstack([${disp.join(", ")}])`;
  const meta = s.outputs.map(q => `    (${JSON.stringify(q.name)}, ${JSON.stringify(q.label)}, ${JSON.stringify(q.unit)}, ${JSON.stringify(q.fmt || ".4g")}, ${pyLit(q.limit || {})}),`).join("\n");
  let b2 = `_ns = {}\nexec(${v}_src, _ns)\n_kw = dict(${v}_ui.value)\n`;
  if (c.rows) b2 += `_kw[${JSON.stringify(s.table.name)}] = list(${v}_table.value)\n`;
  b2 += `_r = _ns["calc"](**_kw)\n_meta = [\n${meta}\n]\n`;
  if (tols.length) {
    b2 += `_tol = ${pyLit(Object.fromEntries(tols.map(i => [i.name, i.tol_pct])))}\n_lo, _hi = {}, {}\nif ${v}_wc.value:\n    import itertools as _it\n    for _signs in _it.product((-1.0, 1.0), repeat=len(_tol)):\n        _k2 = dict(_kw)\n        for (_n, _p), _sg in zip(_tol.items(), _signs):\n            _k2[_n] = _kw[_n] * (1 + _sg * _p / 100.0)\n        for _k, _x in _ns["calc"](**_k2).items():\n            _lo[_k] = min(_lo.get(_k, _x), _x)\n            _hi[_k] = max(_hi.get(_k, _x), _x)\n`;
  } else b2 += "_lo, _hi = {}, {}\n";
  b2 += `_rows = []
for _k, _lbl, _u, _f, _lim in _meta:
    _v = float(_r[_k])
    _st = ""
    if _lim:
        _st = "PASS"
        if ("warn_min" in _lim and _v < _lim["warn_min"]) or ("warn_max" in _lim and _v > _lim["warn_max"]):
            _st = "WARN"
        if ("min" in _lim and _v < _lim["min"]) or ("max" in _lim and _v > _lim["max"]):
            _st = "FAIL"
    _wc = f" ({_lo[_k]:{_f}} … {_hi[_k]:{_f}})" if _k in _lo else ""
    _rows.append(f"| {_lbl} | \`{_v:{_f}}\`{_wc} | {_u} | {_st} |")
mo.vstack([
    mo.md("| Output | Value (EVA min … max) | Unit | Check |\\n|---|---|---|---|\\n" + "\\n".join(_rows)),
    mo.accordion({"Show Python": mo.ui.code_editor(value=${v}_src, language="python", disabled=True)}),
])`;
  const args2 = ["mo"].concat(ret).sort();
  return cell(["mo"], b1, ret) + "\n\n" + cell(args2, b2) + "\n";
}

function marimoImageCell(key, label) {
  return cell(["mo"], `mo.vstack([\n    mo.md(${JSON.stringify("**" + label + "** — save the image as `public/" + key + ".png`")}),\n    mo.image(src=${JSON.stringify("public/" + key + ".png")}),\n])`);
}

/* BOM loader (kicad-cli BOM CSV) + comparison of calculator inputs vs schematic values. */
function marimoBomCells(calcs) {
  const links = [];
  for (const c of calcs) for (const i of c.spec.inputs) if (i.refdes) links.push({ ref: i.refdes, v: pyVar(c.spec.id), name: i.name, scale: unitScale(i.unit), unit: i.unit });
  const uiVars = [...new Set(links.map(l => l.v + "_ui"))].sort();
  const load = `import csv as _csv
import re as _re
from pathlib import Path as _Path

# Produce bom.csv next to this notebook with:
#   kicad-cli sch export bom --fields "*" --ref-range-delimiter "" -o bom.csv <sheet>.kicad_sch
bom_path = _Path("bom.csv")
bom_rows = []
if bom_path.exists():
    with bom_path.open(newline="", encoding="utf-8-sig") as _fh:
        bom_rows = list(_csv.DictReader(_fh))

_SI = {"p": 1e-12, "n": 1e-9, "u": 1e-6, "µ": 1e-6, "m": 1e-3, "k": 1e3, "K": 1e3, "M": 1e6, "G": 1e9, "R": 1.0, "r": 1.0}

def parse_value(text):
    """'22.1k' -> 22100.0, '4k7' -> 4700.0, '100nF' -> 1e-07, '27R' -> 27.0; None if not numeric."""
    t = str(text).strip().replace("Ω", "").replace("ohm", "").replace(" ", "")
    m = _re.match(r"^(\\d+)([pnuµmkKMGRr])(\\d+)", t)
    if m:
        return float(m.group(1) + "." + m.group(3)) * _SI[m.group(2)]
    m = _re.match(r"^([0-9]*\\.?[0-9]+(?:[eE][-+]?\\d+)?)([pnuµmkKMGRr]?)", t)
    if not m:
        return None
    return float(m.group(1)) * _SI.get(m.group(2), 1.0)

def _refs(cell):
    out = []
    for part in _re.split(r"[,\\s]+", cell or ""):
        m = _re.match(r"^([A-Za-z]+)(\\d+)-[A-Za-z]*(\\d+)$", part)
        if m:
            out += [m.group(1) + str(n) for n in range(int(m.group(2)), int(m.group(3)) + 1)]
        elif part:
            out.append(part)
    return out

bom_by_ref = {}
for _row in bom_rows:
    _refcol = _row.get("Reference") or _row.get("Refs") or _row.get("Ref") or ""
    for _r in _refs(_refcol):
        bom_by_ref[_r] = _row

mo.vstack([
    mo.md(f"**BOM:** {len(bom_rows)} rows loaded from \`{bom_path}\`" if bom_rows else
          "**BOM:** \`bom.csv\` not found — export it with kicad-cli (see comment in this cell)."),
    mo.ui.table(bom_rows) if bom_rows else mo.md(""),
])`;
  const linkLit = links.map(l => `    (${JSON.stringify(l.ref)}, ${JSON.stringify(l.v)}, ${JSON.stringify(l.name)}, ${l.scale}, ${JSON.stringify(l.unit)}, ${l.v}_ui),`).join("\n");
  const cmp = `_links = [
${linkLit}
]
_lines = ["| Refdes | Calculator input | Calculator value | Schematic value | Match |", "|---|---|---|---|---|"]
for _ref, _calc, _inp, _scale, _unit, _ui in _links:
    _calc_v = float(_ui.value[_inp]) * _scale
    _row = bom_by_ref.get(_ref)
    _sch = parse_value(_row.get("Value", "")) if _row else None
    if _sch is None:
        _ok = "no BOM data"
    else:
        _ok = "OK" if abs(_sch - _calc_v) <= 1e-3 * max(abs(_sch), 1e-30) else "MISMATCH"
    _shown = _row.get("Value", "") if _row else "—"
    _lines.append(f"| {_ref} | {_calc}.{_inp} | {_ui.value[_inp]} {_unit} | {_shown} | {_ok} |")
mo.md("**Calculator inputs vs schematic values**\\n\\n" + "\\n".join(_lines))`;
  return cell(["mo"], load, ["bom_by_ref", "bom_path", "bom_rows", "parse_value"]) + "\n\n" +
    cell(["bom_by_ref", "mo", "parse_value"].concat(uiVars).sort(), cmp) + "\n";
}

function buildMarimo(state, opts) {
  opts = Object.assign({ withBom: true, header: "" }, opts || {});
  const f = state.f, calcs = effectiveCalcs(state), nums = calcNumbering(state);
  const byId = Object.fromEntries(calcs.map(c => [c.spec.id, c]));
  const cells = [];
  cells.push(cell([], "import marimo as mo", ["mo"]));
  cells.push(mdCellPy(`# ${f.block_id || "Design block"} — ${f.block_title || ""}\n\nDesign-block documentation (schematic + layout + analyses). Calculators run live; expand **Show Python** to see the code.`));
  DOC.forEach((s, si) => {
    let md = `## ${si}. ${s.title}\n\n> **How to fill:** ${s.howto}\n\n`;
    const flush = () => { if (md.trim()) cells.push(mdCellPy(md)); md = ""; };
    for (const b of s.blocks) {
      if (b.t === "image") { flush(); cells.push(marimoImageCell(b.k, b.label)); }
      else if (b.t === "calcs") { flush(); for (const c of calcs.filter(c => c.spec.home === b.home)) cells.push(marimoCalcCells(c, nums[c.spec.id])); }
      else if (b.t === "excerpts") {
        flush();
        for (const x of state.ex || []) {
          cells.push(mdCellPy(`### Excerpt: ${x.doc || x.id}\n\n*${excerptCaption(x)}*\n\n` + mdTable([{ h: "Parameter" }, { h: "Min" }, { h: "Typ" }, { h: "Max" }, { h: "Unit" }, { h: "Cite" }], x.rows)));
          cells.push(marimoImageCell(x.id, excerptCaption(x)));
        }
      }
      else if (b.t === "analyses") {
        flush();
        for (const a of ANALYSES) {
          cells.push(mdCellPy(analysisMd(a, state, nums, byId)));
          if (f[a.id + ".appl"] !== "N/A") for (const id of a.calcs || []) if (byId[id]) cells.push(marimoCalcCells(byId[id], nums[id]));
        }
      }
      else md += mdBlock(b, state, calcs, nums, null, byId);
    }
    flush();
    if (s.id === "s4" && opts.withBom) cells.push(marimoBomCells(calcs));
  });
  return unmark(`${opts.header}import marimo\n\n__generated_with = "${MARIMO_VERSION}"\napp = marimo.App(width="medium")\n\n\n` +
    cells.map(c => c.replace(/\s+$/, "") + "\n").join("\n\n") +
    `\n\nif __name__ == "__main__":\n    app.run()\n`);
}
function analysisMd(a, state, nums, byId) {
  const f = state.f;
  let t = `### ${a.id} — ${a.title}\n\n**Applicability:** ${f[a.id + ".appl"] || "Required"}${f[a.id + ".appl"] === "N/A" ? " — " + (f[a.id + ".just"] || "_(justification)_") : ""} · **Status:** ${f[a.id + ".status"] || "Not started"}\n\n${a.why}\n\n`;
  if (f[a.id + ".appl"] === "N/A") return t;
  if (a.note) t += `> ${a.note}\n\n`;
  for (const k of ["inputs", "results", "margin"]) t += `- **${k[0].toUpperCase() + k.slice(1)}:** ${f[a.id + "." + k] || ""}\n`;
  t += "\n";
  for (const tb of [a.table, a.table2]) if (tb) t += mdTable(tb.cols, state.t[tb.key]) + "\n";
  if (a.links) t += "Related calculators: " + a.links.map(id => `${nums[id] || ""} ${byId[id] ? byId[id].spec.title : id}`).join("; ") + "\n";
  return t;
}

/* Snippet for the "Copy as marimo cell" button (cells in .py-file format). */
function marimoCalcSnippet(c, num) {
  return unmark("# Paste into a marimo .py notebook (two cells: controls, then result + code reveal).\n" +
    "# Requires a cell that does `import marimo as mo` and returns (mo,).\n\n" + marimoCalcCells(c, num));
}

/* ==========================================================================
   4) DOM HELPERS
   ========================================================================== */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;

function histogramSvg(r, o) {

  svg.setAttribute("aria-label", `Histogram from ${fmtNum(r.mc_min, o.fmt)} to ${fmtNum(r.mc_max, o.fmt)} ${o.unit}`);

  svg.append(base);
  r.counts.forEach((c, i) => {
    const rect = document.createElementNS(ns, "rect");
    const x0 = x(r.edges[i]), x1 = x(r.edges[i + 1]);
    rect.setAttribute("x", x0); rect.setAttribute("width", Math.max(0.5, x1 - x0 - 0.5));

    const v = o.limit && o.limit[k];
    if (v != null && v >= lo && v <= hi) { const l = document.createElementNS(ns, "line"); l.setAttribute("class", "lim"); l.setAttribute("x1", x(v)); l.setAttribute("x2", x(v)); l.setAttribute("y1", 0); l.setAttribute("y2", H); svg.append(l); }

}
