      const ok = await validateAndAdd(lastRaw, status);
      if (!ok) { retryBtn.hidden = false; editBtn.hidden = false; }
    } catch (e) {
      const code = e && e.code;
      if (code === "not_granted") { AI.status = "unavailable"; setAiPill(); status.className = "calc-msg na"; status.textContent = "Permission not granted — use the manual path below."; }
      else if (code === "rate_limited") { AI.cooldownUntil = Date.now() + 30000; status.className = "calc-msg err"; status.textContent = "Rate limited: " + (e.message || "") + " — wait a little and click Retry."; retryBtn.hidden = false; }
      else { status.className = "calc-msg err"; status.textContent = "Generation failed: " + (e && e.message || e); retryBtn.hidden = false; }
    } finally { genBtn.disabled = AI.status !== "ready"; }
  }
  genBtn.addEventListener("click", generate);
  retryBtn.addEventListener("click", generate);
  editBtn.addEventListener("click", () => {
    if (lastRaw && typeof lastRaw === "object") fill({ ...lastRaw, io: { inputs: lastRaw.inputs || [], outputs: lastRaw.outputs || [] } });
    manual.open = true; f.python.focus();
  });

  const card = h("section", { class: "card newcalc", "aria-label": "New calculator from screenshot" },
    h("div", { class: "card-head" }, h("h3", { text: "＋ New calculator from screenshot" })),
    h("p", { class: "muted small", text: "Snip an equation (Win+Shift+S), click the box and press Ctrl+V. Claude reads it and returns a calculator spec + Python; it is validated and smoke-tested in Pyodide before it is added. Generated calculators are saved in this browser." }),
    zone, h("div", { class: "row" }, hint), h("div", { class: "row" }, genBtn, retryBtn, editBtn), status, manual);
  setTimeout(setAiPill, 0);
  return card;
}

function addCustomCalc(spec) {
  const ids = new Set(CALCULATORS.map(c => c.id).concat((STATE.custom || []).map(c => c.id)));
  let id = spec.id, n = 2; while (ids.has(id)) id = spec.id + "_" + (n++);
  spec = Object.assign({}, spec, { id, home: "s5" });
  STATE.custom.push(spec); changed();
  const mount = $("#calcs-s5");
  const ctrl = renderCalculator(spec, mount, { num: calcNumbering(STATE)[id], custom: true });
  refreshApplySelects();
  ctrl.card.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ==========================================================================
   11) SECTION-SPECIFIC BLOCKS: ADRs, analyses, excerpts
   ========================================================================== */
function renderAdrs(def) {
  const list = h("div", { class: "stack" });
  const draw = () => list.replaceChildren(...STATE.adr.map((a, i) => {
    const fld = (k, label, ph) => {
      const ed = makeEditable(h("div", { class: "field" + (k === "id" ? "" : " prose"), role: "textbox", "aria-label": label, "data-track": "" }), a[k], ph, v => { a[k] = v; changed(); }, k === "id");
      return h("div", { class: "fld" }, h("span", { class: "lbl", text: label }), ed);
    };
    return h("article", { class: "card adr" },
      h("div", { class: "card-head" }, h("h4", { text: a.id || "ADR" }),
        chipSelect(["Proposed", "Accepted", "Superseded", "Rejected"], a.status, v => { a.status = v; changed(); }, "ADR status"),
        h("button", { class: "btn tiny danger", text: "Remove", onclick: () => { STATE.adr.splice(i, 1); changed(); draw(); } })),
      h("div", { class: "fields" }, fld("id", "ID", "ADR-00x"), fld("context", "Context", "What forces the decision?"), fld("decision", "Decision", "What we do"), fld("consequences", "Consequences", "What follows, good and bad"), fld("rejected", "Rejected alternatives", "What we did not do and why")));
  }));
  draw();
  return h("div", { class: "stack" }, h("h3", { class: "subhead", text: def.title }), list,
    h("div", {}, h("button", { class: "btn tiny", text: "+ ADR", onclick: () => { STATE.adr.push({ id: "ADR-" + String(STATE.adr.length + 1).padStart(3, "0"), status: "Proposed" }); changed(); draw(); } })));
}

function renderAnalyses() {
  const nums = calcNumbering(STATE);
  return h("div", { class: "stack" }, ANALYSES.map(a => {
    const f = k => a.id + "." + k;
    const card = h("article", { class: "card analysis", id: "an-" + a.id, "aria-labelledby": "an-h-" + a.id });
    const just = h("div", { class: "fld", hidden: STATE.f[f("appl")] !== "N/A" }, renderProse(f("just"), "N/A justification", "Why this analysis does not apply"));
    const applSel = h("select", { "aria-label": a.id + " applicability" }, ["Required", "N/A"].map(o => h("option", { value: o, text: o })));
    applSel.value = STATE.f[f("appl")] || "Required";
    const paint = () => { const na = applSel.value === "N/A"; card.classList.toggle("na", na); just.hidden = !na; };
    applSel.addEventListener("change", () => { STATE.f[f("appl")] = applSel.value; paint(); changed(); });
    const body = h("div", { class: "an-body" },
      a.note ? h("div", { class: "callout-warn", text: a.note }) : null,
      h("div", { class: "grid-2" },
        renderProse(f("inputs"), "Inputs & assumptions", "Rails, tolerances, temperatures, sources"),
        renderProse(f("results"), "Results", "What the analysis shows"),
        renderProse(f("margin"), "Margin / conclusion", "Margin vs limit, pass/fail reasoning")));
    for (const tb of [a.table, a.table2]) if (tb) body.append(docTable(tb));
    if (a.calcs) { const m = h("div", { class: "stack" }); body.append(m); a.calcs.forEach(id => { const c = CALCULATORS.find(x => x.id === id); if (c) renderCalculator(c, m, { num: nums[id] }); }); }
    if (a.links) body.append(h("p", { class: "calc-links" }, "Calculator" + (a.links.length > 1 ? "s" : "") + ": ",
      a.links.map((id, i) => { const c = CALCULATORS.find(x => x.id === id); return [i ? " · " : "", h("a", { href: "#calc-" + id, text: (nums[id] || "") + " " + (c ? c.title : id) })]; })));
    body.append(renderImageSlot("ev_" + a.id, a.id + " evidence", "Scope capture, simulation plot, calculator screenshot…"));
    card.append(
      h("div", { class: "card-head" }, h("h3", { id: "an-h-" + a.id }, h("span", { class: "an-id", text: a.id + " " }), a.title),
        h("span", { class: "an-ctl" }, applSel, chipSelect(ST_ANALYSIS, STATE.f[f("status")], v => { STATE.f[f("status")] = v; changed(); }, a.id + " status"))),
      h("p", { class: "an-why", text: a.why }), just, body);
    paint();
    return card;
  }));
}

/* Transcribed excerpt values -> calculator inputs ("Apply to…") */
function applyOptions() {
  const nums = calcNumbering(STATE);
  return [h("option", { value: "", text: "Apply to…" })].concat(effectiveCalcs(STATE).map(c => h("optgroup", { label: (nums[c.spec.id] || "") + " " + c.spec.title },
    c.spec.inputs.filter(i => !i.options).map(i => h("option", { value: c.spec.id + "|" + i.name, text: i.label + (i.unit ? " [" + i.unit + "]" : "") })))));
}
function refreshApplySelects() { $$("select.apply-to").forEach(s => s.replaceChildren(...applyOptions())); }

function renderExcerpts() {
  const list = h("div", { class: "stack" });
  const one = (x, i) => {
    const cap = h("div", { class: "caption-out" });
    const paintCap = () => { cap.textContent = excerptCaption(x); };
    const fld = (k, label, ph) => h("div", { class: "fld" }, h("span", { class: "lbl", text: label }),
      makeEditable(h("div", { class: "field", role: "textbox", "aria-label": label }), x[k], ph, v => { x[k] = v; paintCap(); changed(); }, true));
    paintCap();
    x.rows = x.rows || [];
    const tbl = renderTable({
      cols: [{ h: "Param" }, { h: "Min", type: "num" }, { h: "Typ", type: "num" }, { h: "Max", type: "num" }, { h: "Unit" }, { h: "Cite" }],
      rows: x.rows, caption: "Transcribed values", extraHead: "Use", track: false, onChange: changed,
      extra: (row) => {
        const sel = h("select", { class: "apply-to", "aria-label": "Apply value to calculator input" }, applyOptions());
        sel.addEventListener("change", () => {
          if (!sel.value) return;
          const [cid, name] = sel.value.split("|"); sel.value = "";
          const v = [row[2], row[3], row[1]].map(s => parseFloat(String(s).replace(",", "."))).find(n => isFinite(n));
          if (v == null) { toast("Row has no numeric min/typ/max value."); return; }
          const cite = `${x.doc || "datasheet"}${x.rev ? " Rev " + x.rev : ""}${x.page ? " p." + x.page : ""} — ${row[0] || ""}`;
          if (CALC_CTRL[cid]) { CALC_CTRL[cid].setInput(name, v, cite); toast(`Set ${name} = ${v} in ${CALC_CTRL[cid].spec.title}`); CALC_CTRL[cid].card.scrollIntoView({ behavior: "smooth", block: "center" }); }
        });
        return h("td", {}, sel);
      }
    });
    return h("article", { class: "card" },
      h("div", { class: "card-head" }, h("h4", { text: "Excerpt " + (i + 1) }), h("button", { class: "btn tiny danger", text: "Remove", onclick: () => { STATE.ex.splice(i, 1); Store.saveImg(x.id, null); delete IMAGES[x.id]; changed(); draw(); } })),
      h("div", { class: "excerpt" },
        h("div", { class: "stack" }, renderImageSlot(x.id, "Datasheet excerpt", "Crop a figure/table from the PDF"), cap),
        h("div", { class: "stack" },
          h("div", { class: "fields x-fields" }, fld("mfr", "Manufacturer", "e.g. Silicon Labs"), fld("doc", "Doc ID", "e.g. CP2102N-DS"), fld("rev", "Revision", "e.g. 1.3"), fld("date", "Date", "YYYY-MM"), fld("page", "Page", "12"), fld("fig", "Fig./Table", "Fig. 3"),
            h("div", { class: "x-full" }, fld("cond", "Test conditions", "T_A, V_DD, load…"))),
          tbl)));
  };
  const draw = () => list.replaceChildren(...STATE.ex.map(one));
  draw();
  return h("div", { class: "stack" }, h("h3", { class: "subhead", text: "Datasheet excerpts" }),
    h("p", { class: "muted small", text: "Caption builds itself: © Mfr — DocID Rev X (date), p.N, Fig. M — conditions. Use “Apply to…” to push a transcribed value into a calculator input (the citation is shown under the input)." }),
    list, h("div", {}, h("button", { class: "btn tiny", text: "+ Excerpt", onclick: () => { STATE.ex.push({ id: "x" + Date.now().toString(36), rows: [["", "", "", "", "", ""]] }); changed(); draw(); } })));
}

/* ==========================================================================
   12) DOCUMENT RENDERING, TOC, PROGRESS
   ========================================================================== */
function renderBlock(b) {
  switch (b.t) {
    case "fields": return renderFields(b.items);
    case "prose": return renderProse(b.k, b.label, b.ph);
    case "table": return docTable(b);
    case "image": return renderImageSlot(b.k, b.label, b.hint);
    case "adrs": return renderAdrs(b);
    case "calcs": {
      const m = h("div", { class: "stack", id: "calcs-" + b.home });
      const nums = calcNumbering(STATE);
      effectiveCalcs(STATE).filter(c => c.spec.home === b.home).forEach(c => renderCalculator(c.spec, m, { num: nums[c.spec.id], custom: !CALCULATORS.includes(c.spec) }));
      return m;
    }
    case "newcalc": return renderNewCalcZone();
    case "analyses": return renderAnalyses();
    case "excerpts": return renderExcerpts();
  }
  return null;
}
function renderSection(s, i) {
  return h("section", { class: "section", id: s.id, "aria-labelledby": s.id + "-h" },
    h("h2", { id: s.id + "-h" }, h("span", { class: "num", "aria-hidden": "true", text: String(i).padStart(2, "0") }), h("span", { class: "sec-title", text: s.title })),
    h("div", { class: "callout-howto", text: s.howto }),
    s.blocks.map(renderBlock));
}
function renderToc() {
  return h("nav", { class: "toc", id: "toc", "aria-label": "Contents" }, h("ol", {}, DOC.map((s, i) => h("li", {},
    h("a", { href: "#" + s.id, "data-sec": s.id, onclick: () => $("#toc").classList.remove("open") }, h("span", { class: "num", text: String(i).padStart(2, "0") }), h("span", { class: "toc-title", text: s.title }), h("span", { class: "prog", "aria-hidden": "true" }))))));
}
function updateBrand() {
  const id = STATE.f.block_id || "Design block", title = STATE.f.block_title || "";
  const b = $("#brand-id"); if (b) b.textContent = id;
  const t = $("#brand-title"); if (t) t.textContent = title;
  const dt = $("#doc-title"); if (dt) dt.textContent = id;
  const ds = $("#doc-sub"); if (ds) { ds.textContent = title || "Add a one-line title in §0 Document control"; ds.classList.toggle("placeholder", !title); }
}

function computeProgress() {
  for (const s of DOC) {
    const sec = document.getElementById(s.id); if (!sec) continue;
    let tot = 0, done = 0;
    $$("[data-track]", sec).forEach(e => { if (e.closest(".na")) return; tot++; if (e.textContent.trim()) done++; });
    $$("[data-track-table]", sec).forEach(e => { if (e.closest(".na")) return; tot++; if ($$(".cell", e).some(td => td.textContent.trim()) || $$("input[type=checkbox]", e).some(c => c.checked)) done++; });
    $$("[data-track-img]", sec).forEach(e => { if (e.closest(".na")) return; tot++; if (e.dataset.filled) done++; });
    if (s.id === "s5") { tot = Math.max(tot, 1); done = $$(".calc", sec).length ? tot : 0; }
    if (s.id === "s6") { const an = $$(".analysis", sec); tot = an.length; done = an.filter(a => a.classList.contains("na") || /Pass|Fail|Waived/.test($(".an-ctl select.chip", a).value)).length; }
    const dot = $(`.toc a[data-sec="${s.id}"] .prog`);
    if (dot) { const r = tot ? done / tot : 0; dot.className = "prog " + (r >= 0.999 ? "done" : r > 0 ? "partial" : ""); dot.title = `${done}/${tot} filled`; }
  }
}
const scheduleProgress = debounce(computeProgress, 250);

function renderDoc() {
  Object.keys(CALC_CTRL).forEach(k => delete CALC_CTRL[k]);
  Object.keys(Py.cache).forEach(k => Py.dispose(k));
  const doc = $("#doc");
  doc.replaceChildren(
    h("header", { class: "doc-head" },
      h("div", { class: "doc-eyebrow" }, h("span", { text: "Design block record" }), h("span", { class: "doc-eyebrow-sep", "aria-hidden": "true" }), h("span", { text: "KiCad hierarchical sheet" })),
      h("h1", { class: "doc-title", id: "doc-title" }),
      h("p", { class: "doc-sub", id: "doc-sub" }),
      h("p", { class: "doc-intro", text: "Reusable documentation template for KiCad hierarchical design blocks. Prefilled as a worked example (USB2UART CP2102N). Every field is editable; edits are kept in this browser only." }),
      h("div", { class: "callout-warn", text: "Numbers tagged ‘verify’ (derating factors, thermal resistances, pin ratings, clamp voltages) are illustrative — check each against the archived datasheet revision or your derating standard before release." })),
    ...DOC.map(renderSection));
  $("#toc-host").replaceChildren(renderToc());
  updateBrand();
  computeProgress();
  setAiPill();
  watchActiveSection();
}
let _io = null;
function watchActiveSection() {
  if (!("IntersectionObserver" in window)) return;
  if (_io) _io.disconnect();
  _io = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting) {
      $$(".toc a").forEach(a => a.classList.toggle("active", a.dataset.sec === e.target.id));
    }
  }, { rootMargin: "-20% 0px -70% 0px" });
  DOC.forEach(s => { const el = document.getElementById(s.id); if (el) _io.observe(el); });
}

/* ==========================================================================
   13) TOOLBAR ACTIONS: exports, clear, reset
   ========================================================================== */
function exportMarimo() {
  const header = `# ${STATE.f.block_id || "design_block"} — generated by design_block_doc.html\n# Run:    marimo edit ${(STATE.f.block_id || "design_block").toLowerCase()}.py\n# Export: marimo export html-wasm ${(STATE.f.block_id || "design_block").toLowerCase()}.py -o dist --mode run --show-code\n`;
  openModal({ title: "Export marimo notebook", note: "Downloads are blocked here: copy the text into a .py file. Images are referenced as public/<slot>.png — save your screenshots there.", text: buildMarimo(STATE, { header }) });
}
function exportMarkdown() {
  openModal({ title: "Export Markdown", note: "Includes the latest computed outputs. Images are referenced as public/<slot>.png.", text: buildMarkdown(STATE, RESULTS) });
}
async function clearToBlank() {
  if (!(await confirmModal("Clear example → blank template", "Replace all example content with empty placeholders? Structure, checklists and calculator defaults stay; your added calculators are kept. Pasted images are removed.", "Clear"))) return;
  for (const k of Object.keys(IMAGES)) { Store.saveImg(k, null); delete IMAGES[k]; }
  STATE = blankState(STATE); Store._save(); renderDoc();
  toast("Blank template ready.");
}
async function resetAll() {
  if (!(await confirmModal("Reset", "Discard all local edits, images and added calculators, and restore the CP2102N worked example?", "Reset"))) return;
  Store.clearAll(); for (const k of Object.keys(IMAGES)) delete IMAGES[k];
  STATE = exampleState(); Store._save(); renderDoc();
  toast("Worked example restored.");
}

/* ==========================================================================
   14) BOOT
   ========================================================================== */
function migrate(s) {
  const ex = exampleState();
  if (!s || s.v !== 1) return ex;
  for (const k of ["f", "t", "ci", "cs", "bind", "tin"]) s[k] = Object.assign({}, k === "f" || k === "t" ? ex[k] : {}, s[k] || {});
  for (const k of ["adr", "ex", "custom"]) if (!Array.isArray(s[k])) s[k] = ex[k] || [];
  return s;
}
function boot() {
  STATE = migrate(Store.load());
  $("#btn-marimo").addEventListener("click", exportMarimo);
  $("#btn-md").addEventListener("click", exportMarkdown);
  $("#btn-clear").addEventListener("click", clearToBlank);
  $("#btn-reset").addEventListener("click", resetAll);
  $("#btn-toc").addEventListener("click", () => { const t = $("#toc"); const open = t.classList.toggle("open"); $("#btn-toc").setAttribute("aria-expanded", String(open)); });
  $("#py-pill").addEventListener("click", () => { if (Py.status === "unavailable") { Py.ready().then(() => Object.values(CALC_CTRL).forEach(c => c.run(true))).catch(() => { }); } });
  Py.setPill();
  renderDoc();
  setSaved(Store.ok ? "Edits saved in this browser" : "Storage unavailable — edits not kept");
  Py.ready().catch(() => { });          // start loading right after first render
  initSample();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
